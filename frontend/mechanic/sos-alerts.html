<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="oo-PKXYE2tMvJTEH0tq6-_hivJePvxok7u9f9tqAp28" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency SOS Alerts - GarageNearMe</title>
  <link rel="manifest" href="/mechanic/manifest.json">
  <meta name="theme-color" content="#DC2626">
  <link rel="stylesheet" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/mechanic.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet" />
  <script>
    const SUPPORTED_LANGUAGES = ['hinglish', 'hindi', 'gujarati'];
    const DEFAULT_LANGUAGE = 'hinglish';
    let currentTranslations = {};
    let currentLang = DEFAULT_LANGUAGE;
    function getMechanicLanguage() { const saved = localStorage.getItem('mechanic_lang'); return SUPPORTED_LANGUAGES.includes(saved) ? saved : DEFAULT_LANGUAGE; }
    function setMechanicLanguage(lang) { if (!SUPPORTED_LANGUAGES.includes(lang)) return; localStorage.setItem('mechanic_lang', lang); applyLanguage(lang); }
    async function loadLanguageFile(lang) { try { const res = await fetch(`/lang/${lang}.json`); if (!res.ok) throw new Error('Language file not found: ' + lang); return await res.json(); } catch (err) { console.error('i18n load error:', err); if (lang !== DEFAULT_LANGUAGE) { const res = await fetch(`/lang/${DEFAULT_LANGUAGE}.json`); return await res.json(); } return {}; } }
    function applyTranslationsToDOM() { document.querySelectorAll('[data-i18n]').forEach((el) => { const key = el.getAttribute('data-i18n'); if (currentTranslations[key]) el.textContent = currentTranslations[key]; }); }
    function t(key) { return currentTranslations[key] || key; }
    async function applyLanguage(lang) { currentLang = lang; currentTranslations = await loadLanguageFile(lang); applyTranslationsToDOM(); document.dispatchEvent(new CustomEvent('i18n:ready')); }
    document.addEventListener('DOMContentLoaded', () => { applyLanguage(getMechanicLanguage()); });
  </script>
  <style>
    body { background-color: #FEF2F2; }
    .mechanic-layout { background-color: transparent; }

    .sos-card { border: 2px solid #EF4444; background: white; transition: all 0.2s ease; box-shadow: 0 10px 25px rgba(239,68,68,0.15); }
    .sos-card:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(239,68,68,0.2); }

    .pulse-dot { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      70%  { box-shadow: 0 0 0 15px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }

    .radar-bg { position:absolute; top:-50%; right:-10%; width:400px; height:400px; border-radius:50%; border:1px solid rgba(239,68,68,0.1); z-index:0; pointer-events:none; }
    .radar-bg::before { content:''; position:absolute; top:10%; left:10%; right:10%; bottom:10%; border-radius:50%; border:1px solid rgba(239,68,68,0.1); }
    .radar-bg::after  { content:''; position:absolute; top:20%; left:20%; right:20%; bottom:20%; border-radius:50%; border:1px solid rgba(239,68,68,0.1); }

    .skeleton { background: linear-gradient(90deg,#fde8e8 25%,#fbd5d5 50%,#fde8e8 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:8px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>
<div class="mechanic-layout">
  <div id="sidebar-container"></div>
  <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none z-3" id="sidebarOverlay" style="z-index:1030;"></div>

  <main class="mechanic-main position-relative overflow-hidden">
    <div class="radar-bg"></div>
    <div id="topbar-container"></div>

    <div class="mechanic-content position-relative z-1">

      <!-- Header -->
      <div class="text-center mb-5" id="header-section">
        <h2 class="fw-bold text-danger mb-2" style="font-family:var(--font-head);" id="header-title" data-i18n="sosalerts_header_checking">Checking for SOS alerts...</h2>
        <p class="text-muted" id="header-sub" data-i18n="sosalerts_please_wait">Please wait...</p>
      </div>

      <!-- SOS Cards -->
      <div class="row justify-content-center" id="sos-container">
        <!-- Skeleton -->
        <div class="col-12 col-md-10 col-lg-8">
          <div class="rounded-4 p-4 sos-card">
            <div class="skeleton mb-3" style="height:20px;width:40%;"></div>
            <div class="skeleton mb-2" style="height:28px;width:60%;"></div>
            <div class="skeleton mb-4" style="height:16px;width:50%;"></div>
            <div class="skeleton" style="height:80px;border-radius:12px;"></div>
            <div class="d-flex gap-3 mt-4">
              <div class="skeleton flex-grow-1" style="height:48px;border-radius:30px;"></div>
              <div class="skeleton" style="height:48px;width:100px;border-radius:30px;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- History section -->
      <div class="bg-white rounded-4 border p-4 shadow-sm mt-5 position-relative z-2" id="history-section" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="fw-bold mb-0 text-dark" style="font-family:var(--font-head);" data-i18n="sosalerts_history_title">Recent SOS History</h5>
          <a href="/mechanic/sos-history.html" class="btn btn-sm btn-outline-danger rounded-pill px-3" data-i18n="sosalerts_view_full_history">View Full History</a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="text-muted small">
              <tr>
                <th class="fw-medium pb-3 border-bottom" data-i18n="sosalerts_th_customer_vehicle">Customer &amp; Vehicle</th>
                <th class="fw-medium pb-3 border-bottom" data-i18n="sosalerts_th_location">Location</th>
                <th class="fw-medium pb-3 border-bottom" data-i18n="sosalerts_th_datetime">Date &amp; Time</th>
                <th class="fw-medium pb-3 border-bottom" data-i18n="dashboard_table_status">Status</th>
                <th class="fw-medium pb-3 border-bottom text-end" data-i18n="sosalerts_th_earning">Earning</th>
                <th class="fw-medium pb-3 border-bottom text-center" data-i18n="dashboard_table_action">Action</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

  <script src="/js/config.js"></script>
  <script src="/js/mechanic-auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/bootstrap.js"></script>
<script>
  initMechanicChrome('Active SOS Radar');

  const API = () => getApiBase();
  let refreshInterval = null;
  let _lastAlertIds   = null;

  // ✅ Fix 1 — Always use integers, track timestamp for cleanup
  function getDeclinedSOS() {
    return JSON.parse(localStorage.getItem('declined_sos') || '[]').map(Number);
  }

  function addDeclinedSOS(id) {
    id = parseInt(id); // ✅ Always integer
    const declined = getDeclinedSOS();
    if (!declined.includes(id)) {
      declined.push(id);
      localStorage.setItem('declined_sos', JSON.stringify(declined));
    }
    // ✅ Timestamp save karo — 30 min baad auto-remove
    const times = JSON.parse(localStorage.getItem('declined_sos_time') || '{}');
    times[id] = Date.now();
    localStorage.setItem('declined_sos_time', JSON.stringify(times));
  }

  // ✅ Fix 2 — 30 sec purane declined SOS hata do (naya SOS same area mein aa sakta hai)
  function cleanOldDeclinedSOS() {
    const times = JSON.parse(localStorage.getItem('declined_sos_time') || '{}');
    const now = Date.now();
    const validIds = [];
    const freshTimes = {};
    for (const [id, time] of Object.entries(times)) {
      if (now - time < 30 * 1000) { // 30 seconds
        validIds.push(parseInt(id));
        freshTimes[id] = time;
      }
    }
    localStorage.setItem('declined_sos', JSON.stringify(validIds));
    localStorage.setItem('declined_sos_time', JSON.stringify(freshTimes));
  }

  function goToSOSDetail(sosId) {
    window.location.href = `/mechanic/sos-detail.html?id=${sosId}`;
  }

  async function loadSOSAlerts(forceRender = false) {
    try {
      // ✅ Pehle purane declined clean karo
      cleanOldDeclinedSOS();

      const res = await fetch(`${API()}/sos/active`, {
        headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
      });
      if (!res.ok) throw new Error(await res.text());
      let alerts = await res.json();

      // Check if mechanic already has an active SOS
      let myActive = alerts.find(a => ['accepted', 'on_the_way', 'in_progress'].includes(a.status));
      if (myActive) {
          const activeHtml = `
            <div class="col-12 col-md-10 col-lg-8 mb-4">
              <div class="rounded-4 p-4 sos-card position-relative text-center" style="border-color:#10B981; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.15);">
                <div class="mb-3"><span style="font-size:40px;">🔧</span></div>
                <h4 class="fw-bold mb-2">${t('sosalerts_active_sos_title')}</h4>
                <p class="text-muted mb-4">${t('sosalerts_active_sos_desc_prefix')}${myActive.id}. ${t('sosalerts_active_sos_desc_suffix')}</p>
                <button onclick="goToSOSDetail('${myActive.slug || myActive.id}')" class="btn btn-success fw-bold rounded-pill px-5 py-2 mb-3">${t('sosalerts_open_sos_details')}</button>
                <div class="mt-2">
                  <button onclick="cancelActiveSOS('${myActive.slug || myActive.id}', ${myActive.id})" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-medium" style="font-size:13px;">
                    ⚠️ ${t('sosalerts_cancel_this_sos')}
                  </button>
                  <div class="text-muted mt-2" style="font-size:11px;">${t('sosalerts_visiting_charge_note')}</div>
                </div>
              </div>
            </div>`;
          document.getElementById('sos-container').innerHTML = activeHtml;
          document.getElementById('header-title').textContent = t('sosalerts_active_sos_found');
          document.getElementById('header-sub').textContent = t('sosalerts_complete_current_task');
          return;
      }

      // Sirf broadcasting wale + declined filter
      alerts = alerts.filter(a => a.status === 'broadcasting');
      const declined = getDeclinedSOS();
      // ✅ Fix — parseInt both sides for proper comparison
      alerts = alerts.filter(a => !declined.includes(parseInt(a.id)));

      // Smart re-render
      const currentIds = JSON.stringify(alerts.map(a => a.id).sort());
      if (!forceRender && _lastAlertIds === currentIds) return;
      _lastAlertIds = currentIds;

      renderAlerts(alerts);
      loadHistory();
    } catch(err) {
      document.getElementById('header-title').textContent = t('sosalerts_load_failed');
      document.getElementById('header-sub').textContent = err.message;
    }
  }

  function renderAlerts(alerts) {
    const container = document.getElementById('sos-container');
    const title     = document.getElementById('header-title');
    const sub       = document.getElementById('header-sub');

    if (alerts.length === 0) {
      title.textContent = t('sosalerts_no_active_nearby');
      sub.textContent   = t('sosalerts_refresh_hint');
      container.innerHTML = `
        <div class="col-12 col-md-10 col-lg-8">
          <div class="rounded-4 p-5 text-center bg-white border">
            <div style="font-size:60px;" class="mb-3">📡</div>
            <h5 class="fw-bold text-muted">${t('sosalerts_radar_active')}</h5>
            <p class="text-muted small">${t('sosalerts_waiting_requests')}</p>
          </div>
        </div>`;
      return;
    }

    title.textContent = `${alerts.length} ${alerts.length > 1 ? t('sosalerts_emergency_request_plural') : t('sosalerts_emergency_request_singular')} ${t('sosalerts_nearby_suffix')}`;
    sub.textContent   = t('sosalerts_accept_fast_hint');

    container.innerHTML = alerts.map(a => buildSOSCard(a)).join('');
  }

  function buildSOSCard(a) {
    const vt = a.vehicle_type === 'two_wheeler' ? `🏍️ ${t('vehicle_two_wheeler')}` : a.vehicle_type === 'four_wheeler' ? `🚗 ${t('vehicle_four_wheeler')}` : a.vehicle_type || t('earnings_vehicle_fallback');
    return `
      <div class="col-12 col-md-10 col-lg-8 mb-4">
        <div class="rounded-4 p-4 sos-card position-relative">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div class="d-flex align-items-center gap-2">
              <div class="rounded-circle bg-danger pulse-dot" style="width:12px;height:12px;"></div>
              <span class="text-danger fw-bold text-uppercase">${t('sosalerts_breakdown_alert')}</span>
            </div>
            <span class="badge bg-danger">${a.time_ago}</span>
          </div>

          <div class="row align-items-center mb-4">
            <div class="col-sm-8 mb-3 mb-sm-0">
              <h4 class="fw-bold mb-1">SOS #${a.id}</h4>
              <div class="text-muted mb-2 d-flex align-items-center gap-2" style="font-size:14px;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg>
                ${vt} ${a.vehicle_number ? '• ' + a.vehicle_number : ''}
              </div>
              <div class="d-flex align-items-center gap-2 text-dark fw-bold" style="font-size:15px;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="#EF4444"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                ${a.customer_address || a.address || t('invsos_location_available')}
              </div>
            </div>
            <div class="col-sm-4 text-sm-end text-start">
              ${a.distance_km ? `
              <div class="bg-danger bg-opacity-10 d-inline-block rounded-4 p-3 text-center border border-danger border-opacity-25">
                <div class="fw-bold" style="font-size:1.8rem;color:#EF4444;line-height:1;">${a.distance_km}</div>
                <div class="text-danger fw-medium" style="font-size:12px;text-transform:uppercase;">${t('sosalerts_km_away')}</div>
              </div>` : ''}
            </div>
          </div>

          ${a.description ? `
          <div class="p-3 bg-danger bg-opacity-10 rounded-3 mb-4 border border-danger border-opacity-25 text-danger fw-medium">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" class="me-1"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            "${a.description}"
          </div>` : ''}

          <div class="d-flex flex-column flex-sm-row gap-3">
            <button onclick="acceptSOS('${a.slug || a.id}')" class="btn btn-danger flex-grow-1 fw-bold rounded-pill py-3 shadow fs-5">
              ${t('sosalerts_accept_sos_btn')}
            </button>
            <button onclick="rejectSOS(${a.id}, this)" class="btn btn-outline-secondary rounded-pill px-4 py-3 fw-bold">
              ${t('sosalerts_decline_btn')}
            </button>
          </div>
        </div>
      </div>`;
  }

  async function acceptSOS(id) {
    try {
      const res = await fetch(`${API()}/sos/${id}/accept`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
      });
      if (!res.ok) throw new Error((await res.json()).detail || t('job_generic_failed'));
      window.location.href = `/mechanic/sos-detail.html?id=${id}`;
    } catch(e) {
      showToast(e.message || t('sosalerts_accept_failed'), 'danger');
    }
  }

  async function cancelActiveSOS(slugOrId, id) {
    const confirmed = await new Promise(resolve => {
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
      box.innerHTML = `
        <div style="background:#fff;border-radius:20px;padding:28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
          <div style="text-align:center;margin-bottom:20px;">
            <div style="font-size:40px;">⚠️</div>
            <h6 style="font-weight:700;margin:12px 0 8px;">${t('sosalerts_cancel_confirm_title')}</h6>
            <p style="color:#6B7280;font-size:13px;margin:0;">${t('sosalerts_cancel_confirm_desc')}</p>
          </div>
          <div style="display:flex;gap:10px;">
            <button id="cancelNo" style="flex:1;padding:12px;border:1px solid #E5E7EB;border-radius:12px;background:#fff;font-weight:600;font-size:14px;cursor:pointer;color:#6B7280;">${t('sosalerts_cancel_no')}</button>
            <button id="cancelYes" style="flex:1;padding:12px;border:none;border-radius:12px;background:#EF4444;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">${t('sosalerts_cancel_yes')}</button>
          </div>
        </div>`;
      document.body.appendChild(box);
      box.querySelector('#cancelNo').onclick  = () => { box.remove(); resolve(false); };
      box.querySelector('#cancelYes').onclick = () => { box.remove(); resolve(true); };
    });

    if (!confirmed) return;

    try {
      const token = MECHANIC_AUTH.getToken();
      // Mark SOS as cancelled from garage side — customer ka visiting charge banega
      const res = await fetch(`${API()}/sos/${slugOrId}/complete?final_amount=0`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) {
        // Try cancel endpoint
        const res2 = await fetch(`${API()}/sos/${id}/cancel`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res2.ok) throw new Error(t('sosalerts_cancel_failed_inner'));
      }
      showToast(t('sosalerts_cancel_success'), 'success');
      setTimeout(() => loadSOSAlerts(true), 1000);
    } catch(e) {
      showToast(e.message || t('sosalerts_cancel_failed'), 'danger');
    }
  }

  async function rejectSOS(id, btn) {
    btn.disabled = true; btn.textContent = t('sosalerts_declining');
    addDeclinedSOS(id); // ✅ Integer store hoga
    _lastAlertIds = null;
    await loadSOSAlerts(true);
    // Backend ko bhi batao (silently)
    try {
      await fetch(`${API()}/sos/${id}/decline`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
      });
    } catch { /* ignore */ }
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API()}/sos/history/all`, {
        headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
      });
      if (!res.ok) return;
      const history = await res.json();
      if (history.length === 0) return;

      const sec  = document.getElementById('history-section');
      const tbody = document.getElementById('history-tbody');
      sec.style.display = '';

      tbody.innerHTML = history.slice(0, 5).map(h => {
        const sc = {
          completed: `<span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-2 py-1">${t('status_completed')}</span>`,
          rejected:  `<span class="badge bg-secondary bg-opacity-10 text-secondary border rounded-pill px-2 py-1">${t('sosalerts_status_missed')}</span>`,
          cancelled: `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-pill px-2 py-1">${t('status_cancelled')}</span>`,
        }[h.status] || `<span class="badge bg-secondary rounded-pill px-2 py-1">${h.status}</span>`;

        const date = new Date(h.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
        const time = new Date(h.created_at).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });

        return `<tr>
          <td>
            <div class="fw-bold text-dark">${t('bookings_customer_prefix')} #${h.id}</div>
            <div class="text-muted small">${h.vehicle_model || h.vehicle_type || t('earnings_vehicle_fallback')}${h.vehicle_number ? ' • ' + h.vehicle_number : ''}</div>
          </td>
          <td><div class="text-dark">${h.customer_address || '—'}</div></td>
          <td><div class="text-dark small">${date}, ${time}</div></td>
          <td>${sc}</td>
          <td class="text-end fw-bold ${h.final_charge ? 'text-success' : 'text-muted'}">
            ${h.final_charge ? '₹' + h.final_charge : '--'}
          </td>
          <td class="text-center">
            <a href="/mechanic/sos-detail.html?id=${h.slug || h.id}" class="btn btn-sm btn-outline-danger rounded-pill px-3">${t('sosalerts_view_btn')}</a>
          </td>
        </tr>`;
      }).join('');
    } catch {}
  }

  function showToast(msg, type='success') {
    const t = document.createElement('div');
    t.className = `alert alert-${type} position-fixed shadow rounded-3`;
    t.style.cssText = 'top:80px;right:20px;z-index:9999;font-size:14px;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSOSAlerts(true);
    refreshInterval = setInterval(() => loadSOSAlerts(), 5000);
  });

  document.addEventListener('i18n:ready', () => loadSOSAlerts(true));
</script>
</body>
</html>
