  <script>
    const SUPPORTED_LANGUAGES = ['hinglish', 'hindi', 'gujarati'];
    const DEFAULT_LANGUAGE = 'hinglish';
    let currentTranslations = {};
    let currentLang = DEFAULT_LANGUAGE;
    function getMechanicLanguage() { const saved = localStorage.getItem('mechanic_lang'); return SUPPORTED_LANGUAGES.includes(saved) ? saved : DEFAULT_LANGUAGE; }
    function setMechanicLanguage(lang) { if (!SUPPORTED_LANGUAGES.includes(lang)) return; localStorage.setItem('mechanic_lang', lang); applyLanguage(lang); }
    async function loadLanguageFile(lang) { try { const res = await fetch(`/lang/${lang}.json`); if (!res.ok) throw new Error('Language file not found: ' + lang); return await res.json(); } catch (err) { console.error('i18n load error:', err); if (lang !== DEFAULT_LANGUAGE) { const res = await fetch(`/lang/${DEFAULT_LANGUAGE}.json`); return await res.json(); } return {}; } }
    function applyTranslationsToDOM() { document.querySelectorAll('[data-i18n]').forEach((el) => { const key = el.getAttribute('data-i18n'); if (currentTranslations[key]) el.textContent = currentTranslations[key]; }); }
    function t(key) { return currentTranslations[key] || key; }
    async function applyLanguage(lang) { currentLang = lang; currentTranslations = await loadLanguageFile(lang); applyTranslationsToDOM(); document.dispatchEvent(new CustomEvent('i18n:ready')); }
    document.addEventListener('DOMContentLoaded', () => { applyLanguage(getMechanicLanguage()); });
  </script>

  <style>
    .timeline { position: relative; padding-left: 1.5rem; }
    .timeline::before { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: #e9ecef; }
    .timeline-item { position: relative; margin-bottom: 1.5rem; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-item::before { content: ''; position: absolute; top: 4px; left: -1.5rem; width: 14px; height: 14px; border-radius: 50%; background: #e9ecef; border: 3px solid white; transform: translateX(-6px); z-index: 2; }
    .timeline-item.active::before { background: var(--color-primary); box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2); }
    .timeline-item.done::before { background: #10B981; }
    .timeline-item.done::after { content: ''; position: absolute; top: 4px; left: -1.5rem; width: 2px; height: calc(100% + 1.5rem); background: #10B981; transform: translateX(-0.5px); z-index: 1; }
    .timeline-item:last-child::after { display: none; }
    .estimate-item-row { background: white; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
    .otp-input { letter-spacing: 6px; font-size: 22px; font-weight: 700; text-align: center; font-family: monospace; }
    .status-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .status-pending { background: #EFF6FF; color: #2563EB; }
    .status-accepted { background: #F0FDF4; color: #16A34A; }
    .status-ongoing { background: #FFFBEB; color: #D97706; }
    .status-completed { background: #F0FDF4; color: #15803D; }
    .status-rejected { background: #FEF2F2; color: #DC2626; }
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
  </style>

  <script>
    let bookingId = new URLSearchParams(window.location.search || window.location.href.split('?')[1] || '').get('id');
    if (!bookingId) {
      const pathParts = window.location.pathname.replace(/\/$/, '').split('/');
      const slug = pathParts[pathParts.length - 1];
      if (slug && slug !== 'job-detail' && slug !== 'job-detail.html') bookingId = slug;
    }
    initMechanicChrome(`${t('job_label_job_number')}${bookingId || t('job_details_fallback')}`, null, '/mechanic/bookings.html');

    let booking = null;
    let estimateItems = [];
    let additionalItems = [];
    let otpAction = null;
    let myGarageServices = [];
    let selectedGarageServices = new Set();
    let garageServicesContext = 'estimate';
    let garageProfile = null;

    async function loadJob() {
      if (!bookingId) { window.location.href = '/mechanic/bookings.html'; return; }
      try {
        const res = await fetch(`${getApiBase()}/bookings/garage/${bookingId}`, {
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
        });
        if (!res.ok) throw new Error();
        booking = await res.json();
        bookingId = booking.id;

        try {
          const garageRes = await fetch(`${getApiBase()}/garage/me`, {
            headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
          });
          if (garageRes.ok) garageProfile = await garageRes.json();
        } catch (e) { console.error('Failed to load garage profile'); }

        if (booking.requires_pick_and_drop &&
          (booking.pickup_charge === null || booking.pickup_charge === undefined)) {
          booking.pickup_charge = booking.garage_visiting_charge ?? garageProfile?.visiting_charge ?? 0;
        }

        try {
          const sRes = await fetch(`${getApiBase()}/garage/me/services`, {
            headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
          });
          if (sRes.ok) myGarageServices = await sRes.json();
        } catch (e) { console.error('Failed to load garage services'); }

        if (booking.estimate_details) {
          estimateItems = booking.estimate_details;
        } else if (booking.status === 'pending' || booking.status === 'accepted') {
          autoPopulateRequestedServices();
        }

        if (booking.additional_estimate_details) additionalItems = booking.additional_estimate_details;
        renderPage();
      } catch {
        document.getElementById('page-skeleton').innerHTML = `
        <div class="text-center py-5 text-muted">
          <h5>${t('job_load_failed')}</h5>
          <a href="/mechanic/bookings.html" class="btn btn-sm rounded-pill px-4 text-white mt-2" style="background:var(--color-primary);">← ${t('job_back')}</a>
        </div>`;
      }
    }

    function autoPopulateRequestedServices() {
      if (!booking.service_type) return;
      const requested = booking.service_type.split(',').map(s => s.trim()).filter(s => s);
      requested.forEach(req => {
        const match = myGarageServices.find(s => s.is_available && s.service_name.toLowerCase() === req.toLowerCase());
        if (match) {
          estimateItems.push({ item_name: match.service_name, price: match.price || 0 });
        } else {
          estimateItems.push({ item_name: req, price: 0 });
        }
      });
    }

    function renderPage() {
      document.getElementById('page-skeleton').style.display = 'none';
      document.getElementById('page-content').style.display = '';

      const bookingNo = booking.booking_number || ('BK-' + booking.id);
      document.getElementById('booking-id-display').textContent = bookingNo;

      const chromeTitle = document.getElementById('topbar-title');
      if (chromeTitle) chromeTitle.textContent = `${t('job_label_job_number')}${bookingNo}`;
      document.title = `${t('job_label_job_number')}${bookingNo} - GarageNearMe`;

      const sc = {
        pending:   { label: t('bookings_status_new'), cls: 'status-pending' },
        accepted:  { label: t('status_accepted'),    cls: 'status-accepted' },
        ongoing:   { label: t('status_ongoing'), cls: 'status-ongoing' },
        completed: { label: t('status_completed'),   cls: 'status-completed' },
        rejected:  { label: t('status_rejected'),    cls: 'status-rejected' },
      }[booking.status] || { label: booking.status, cls: 'status-pending' };
      const sb = document.getElementById('status-badge');
      sb.textContent = sc.label;
      sb.className = `status-badge ${sc.cls}`;

      const loc = booking.pickup_address || booking.customer_address || '—';
      document.getElementById('booking-location').textContent = loc;
      if (booking.customer_lat && booking.customer_lng) {
        const nb = document.getElementById('navigate-btn');
        nb.href = `https://maps.google.com/?q=${booking.customer_lat},${booking.customer_lng}`;
        nb.style.display = 'flex';
      }

      document.getElementById('customer-initial').textContent = `C${booking.customer_id}`;
      const custName = booking.customer_name || `${t('bookings_customer_prefix')} #${booking.customer_id}`;
      const custPhone = booking.customer_phone ? ` (+91 ${booking.customer_phone})` : '';
      document.getElementById('customer-name').textContent = custName + custPhone;
      document.getElementById('customer-phone').textContent = t('job_customer_linked');

      const vt = booking.vehicle_type === 'two_wheeler' ? t('vehicle_two_wheeler') : booking.vehicle_type === 'four_wheeler' ? t('vehicle_four_wheeler') : booking.vehicle_type || '—';
      document.getElementById('vehicle-type').textContent = vt;
      document.getElementById('vehicle-model').textContent = booking.vehicle_model || '—';
      document.getElementById('vehicle-number').textContent = booking.vehicle_number || '—';

      const svcEl = document.getElementById('service-type-text');
      if (booking.service_type) {
        svcEl.textContent = booking.service_type;
      } else {
        svcEl.innerHTML = `<span class="text-muted fst-italic">${t('job_no_services_selected')}</span>`;
      }

      if (booking.description) {
        document.getElementById('desc-section').style.display = '';
        document.getElementById('booking-desc').textContent = booking.description;
      }

      if (booking.scheduled_at) {
        document.getElementById('schedule-section').style.display = '';
        document.getElementById('scheduled-at').textContent = new Date(booking.scheduled_at)
          .toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      renderFlow();
    }

    function renderFlow() {
      const el = document.getElementById('flow-section');
      if (booking.status === 'pending') {
        el.innerHTML = renderPendingFlow();
      } else if (booking.status === 'accepted') {
        el.innerHTML = renderEstimateFlow();
      } else if (booking.status === 'ongoing') {
        el.innerHTML = renderOngoingFlow();
      } else if (booking.status === 'completed') {
        el.innerHTML = renderCompletedFlow();
      } else if (booking.status === 'rejected' || booking.status === 'cancelled') {
        el.innerHTML = `<div class="text-center py-4 text-muted"><h6>${t('job_booking_is')} ${booking.status}.</h6><a href="/mechanic/bookings.html" class="btn btn-sm btn-outline-secondary rounded-pill mt-2">← ${t('job_back')}</a></div>`;
      }
    }

    function renderPendingFlow() {
      return `
      <div class="mb-4">
        <div class="fw-bold mb-1" style="font-size:15px;color:var(--color-text);">${t('job_new_booking_request')}</div>
        <div class="text-muted" style="font-size:13px;">${t('job_new_booking_desc')}</div>
      </div>
      ${booking.pickup_address ? `
      <div class="bg-light rounded-3 p-3 mb-4" style="font-size:13px;">
        <div class="text-muted mb-1" style="font-size:11px;text-transform:uppercase;">${t('job_pickup_address')}</div>
        <div class="fw-semibold text-dark">${booking.pickup_address}</div>
      </div>` : ''}
      <div class="d-flex gap-3">
        <button onclick="rejectBooking()" class="btn btn-outline-danger rounded-pill flex-grow-1 fw-medium">${t('job_reject')}</button>
        <button onclick="acceptBooking()" class="btn text-white rounded-pill flex-grow-1 fw-bold" style="background:var(--color-primary);">${t('job_accept_booking')}</button>
      </div>`;
    }

    function renderEstimateFlow() {
      const estStatus = booking.estimate_status;

      if (estStatus === 'pending') {
        return `
        <div class="timeline">
          <div class="timeline-item done"><div class="fw-bold text-success">${t('job_status_accepted')} ✓</div></div>
          <div class="timeline-item active">
            <div class="fw-bold mb-1" style="color:var(--color-primary);">${t('job_estimate_sent_waiting')}</div>
            <div class="text-muted small mb-3">${t('job_otp_sent_whatsapp')}</div>
            <div class="d-flex flex-column gap-2">
              ${renderEstimateItems(estimateItems, false)}
              ${booking.pickup_charge ? `
              <div class="estimate-item-row">
                <span style="font-size:13px;font-weight:500;">${t('job_pickup_charge_label')}</span>
                <span style="font-size:13px;font-weight:700;">₹${booking.pickup_charge}</span>
              </div>` : ''}
            </div>
            <div class="d-flex justify-content-between fw-bold mt-3 pt-2 border-top">
              <span>${t('job_total')}</span>
              <span style="color:var(--color-primary);">₹${booking.estimated_amount || (estimateItems.reduce((s, i) => s + (i.price || 0), 0) + (booking.pickup_charge ? parseFloat(booking.pickup_charge) : 0))}</span>
            </div>
            ${booking.has_hidden_issues ? `<div class="mt-2 p-2 rounded-3" style="background:#FFF7ED;border:1px solid #FED7AA;font-size:12px;color:#C2410C;">⚠️ ${t('job_hidden_issues_warning')}</div>` : ''}

            <!-- ✅ Resend + Enter OTP buttons -->
            <div class="d-flex gap-2 mt-3">
              <button onclick="resendEstimateOTP()" class="btn btn-outline-secondary rounded-pill fw-medium" style="font-size:13px;" id="resend-est-btn">
                🔄 ${t('job_resend_otp')}
              </button>
              <button onclick="openOTP('estimate')" class="btn text-white rounded-pill flex-grow-1 fw-bold" style="background:var(--color-primary);">
                ${t('job_enter_customer_otp')}
              </button>
            </div>
          </div>
          <div class="timeline-item"><div class="text-muted">${t('job_work_started')}</div></div>
        </div>`;
      }

      return `
      <div class="timeline">
        <div class="timeline-item done"><div class="fw-bold text-success">${t('job_status_accepted')} ✓</div></div>
        <div class="timeline-item active">
          <div class="fw-bold mb-3" style="color:var(--color-primary);">${t('job_send_estimate_title')}</div>

          <label class="text-muted mb-2" style="font-size:12px;text-transform:uppercase;">${t('job_known_issues_cost')}</label>
          <div id="est-items-list" class="mb-2 d-flex flex-column gap-2">${renderEstimateItems(estimateItems, true)}</div>

          <div class="row g-2 mb-2">
            <div class="col-7"><input type="text" id="est-item-name" class="form-control form-control-sm rounded-3" placeholder="Service / Item name"></div>
            <div class="col-3"><input type="number" id="est-item-price" class="form-control form-control-sm rounded-3" placeholder="₹"></div>
            <div class="col-2"><button onclick="addEstItem()" class="btn btn-sm w-100 rounded-3 text-white" style="background:var(--color-primary);">+</button></div>
          </div>
          <button onclick="openGarageServices('estimate')" class="btn btn-sm btn-outline-secondary rounded-3 w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14H6v-2h4v2zm0-4H6v-2h4v2zm0-4H6V7h4v2zm8 8h-6v-2h6v2zm0-4h-6v-2h6v2zm0-4h-6V7h6v2z"/></svg>

          <div class="d-flex justify-content-between fw-bold py-2 border-top border-bottom mb-3">
            <span>${t('job_total')}</span>
            <span style="color:var(--color-primary);" id="est-total">₹${estimateItems.reduce((s, i) => s + (i.price || 0), 0) + (booking.requires_pick_and_drop ? parseFloat(booking.pickup_charge || 0) : 0)}</span>

          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">${t('job_pickup_charge_rs_label')}</label>

            <label class="form-check-label text-dark fw-semibold" for="hidden-issues-toggle" style="font-size:13px;">
              ${t('job_hidden_issues_toggle_label')}
            </label>
          </div>
          <div class="text-muted mb-3" style="font-size:12px;">
            ${t('job_otp_two_step_note')}
          </div>

          <div id="est-error" class="alert alert-danger py-2 d-none rounded-3 mb-3" style="font-size:13px;"></div>

          <button onclick="sendEstimate()" class="btn text-white rounded-pill w-100 fw-bold py-2" style="background:var(--color-primary);" id="send-est-btn">
            ${t('job_send_estimate_btn')}
          </button>
        </div>
        <div class="timeline-item"><div class="text-muted">${t('job_work_started')}</div></div>
      </div>`;
    }

    function renderOngoingFlow() {
      const hasAdditional = !!booking.additional_estimate;
      const additionalVerified = booking.additional_otp_verified;

      return `
      <div class="timeline">
        <div class="timeline-item done"><div class="fw-bold text-success">${t('job_status_accepted')} ✓</div></div>
        <div class="timeline-item done">
          <div class="fw-bold text-success mb-2">${t('job_estimate_approved')} ✓</div>
          <div class="d-flex flex-column gap-2">
            ${renderEstimateItems(estimateItems, false)}
            ${booking.pickup_charge ? `
            <div class="estimate-item-row">
              <span style="font-size:13px;font-weight:500;">${t('job_pickup_charge_label')}</span>
              <span style="font-size:13px;font-weight:700;">₹${booking.pickup_charge}</span>
            </div>` : ''}
          </div>
          <div class="d-flex justify-content-between fw-bold mt-3 pt-2 border-top" style="font-size:13px;">
            <span>${t('job_total')}</span><span>₹${booking.estimated_amount || 0}</span>
          </div>
        </div>

        ${booking.has_hidden_issues ? `
        <div class="timeline-item ${hasAdditional && !additionalVerified ? 'active' : hasAdditional && additionalVerified ? 'done' : 'active'}">
          ${hasAdditional && !additionalVerified ? `
            <div class="fw-bold mb-2" style="color:var(--color-primary);">${t('job_additional_estimate_waiting')}</div>
            <div class="text-muted small mb-2">${t('job_otp_sent_whatsapp')}</div>
            ${renderEstimateItems(additionalItems, false)}
            <div class="d-flex justify-content-between fw-bold mt-1 pt-1 border-top mb-3" style="font-size:13px;">
              <span>${t('job_additional_label')}</span><span>₹${booking.additional_estimate}</span>
            </div>
            <!-- ✅ Resend + Enter OTP buttons -->
            <div class="d-flex gap-2 flex-wrap">
              <button onclick="resendAdditionalOTP()" class="btn btn-outline-secondary rounded-pill fw-medium" style="font-size:13px;" id="resend-add-btn">
                🔄 ${t('job_resend_otp')}
              </button>
              <button onclick="startBookingCall()" class="btn btn-outline-success rounded-pill fw-medium" style="font-size:13px;" id="call-customer-btn">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" class="me-1"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                ${t('job_call_customer')}
              </button>
              <button onclick="openOTP('additional')" class="btn text-white rounded-pill flex-grow-1 fw-bold" style="background:var(--color-primary);">
                ${t('job_enter_additional_otp')}
              </button>
            </div>
          ` : hasAdditional && additionalVerified ? `
            <div class="fw-bold text-success">${t('job_additional_work_approved')} ✓</div>
            <div class="text-muted small">₹${booking.additional_estimate} ${t('job_additional_work_approved_amount')}</div>
          ` : `
            <div class="fw-bold mb-2" style="color:var(--color-primary);">${t('job_work_in_progress')}</div>
            <div class="text-muted small mb-3">${t('job_hidden_issues_hint')}</div>

            <label class="text-muted mb-2" style="font-size:12px;text-transform:uppercase;">${t('job_additional_items_label')}</label>
            <div id="add-items-list" class="mb-2 d-flex flex-column gap-2">${renderEstimateItems(additionalItems, true, true)}</div>
            <div class="row g-2 mb-2">
              <div class="col-7"><input type="text" id="add-item-name" class="form-control form-control-sm rounded-3" placeholder="Issue name"></div>
              <div class="col-3"><input type="number" id="add-item-price" class="form-control form-control-sm rounded-3" placeholder="₹"></div>
              <div class="col-2"><button onclick="addAddItem()" class="btn btn-sm w-100 rounded-3 text-white" style="background:var(--color-primary);">+</button></div>
            </div>
            <button onclick="openGarageServices('additional')" class="btn btn-sm btn-outline-secondary rounded-3 w-100 mb-2 d-flex align-items-center justify-content-center gap-2">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14H6v-2h4v2zm0-4H6v-2h4v2zm0-4H6V7h4v2zm8 8h-6v-2h6v2zm0-4h-6v-2h6v2zm0-4h-6V7h6v2z"/></svg>
              ${t('job_select_garage_services')}
            </button>
            <div class="mb-3">
              <input type="text" id="add-note" class="form-control form-control-sm rounded-3" placeholder="Note (optional)">
            </div>
            <div id="add-error" class="alert alert-danger py-2 d-none rounded-3 mb-2" style="font-size:13px;"></div>
            <button onclick="sendAdditionalEstimate()" class="btn btn-outline-warning rounded-pill w-100 fw-bold mb-2" id="send-add-btn">
              ${t('job_send_additional_estimate')}
            </button>
          `}
        </div>
        ` : ''}

        <div class="timeline-item ${!booking.has_hidden_issues || (hasAdditional && additionalVerified) ? 'active' : ''}">
          <div class="fw-bold mb-3" style="color:var(--color-primary);">${t('job_complete_job_title')}</div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">${t('job_final_amount')} (₹)</label>
            <input type="number" id="final-amount-input" class="form-control rounded-3"
              value="${(parseFloat(booking.estimated_amount || 0) + parseFloat(booking.additional_estimate || 0)).toFixed(0)}"
              placeholder="Final amount">
          </div>
          <div id="complete-error" class="alert alert-danger py-2 d-none rounded-3 mb-3" style="font-size:13px;"></div>
          <button onclick="completeJob()" class="btn text-white rounded-pill w-100 fw-bold py-2" style="background:#10B981;" id="complete-btn">
            ${t('job_mark_complete')} ✓
          </button>
        </div>
      </div>`;
    }

    function renderCompletedFlow() {
      const total = parseFloat(booking.final_amount || 0);
      return `
      <div class="timeline">
        <div class="timeline-item done"><div class="fw-bold text-success">${t('job_status_accepted')} ✓</div></div>
        <div class="timeline-item done"><div class="fw-bold text-success">${t('job_estimate_approved')} ✓</div></div>
        ${booking.additional_estimate ? `<div class="timeline-item done"><div class="fw-bold text-success">${t('job_additional_work_done')} ✓</div></div>` : ''}
        <div class="timeline-item done">
          <div class="fw-bold text-success">${t('job_job_completed')} ✓</div>
          ${booking.completed_at ? `<div class="text-muted small">${new Date(booking.completed_at).toLocaleString('en-IN')}</div>` : ''}
        </div>
      </div>
      <div class="mt-4 p-3 rounded-3" style="background:#F0FDF4;border:1px solid #BBF7D0;">
        <div class="text-muted small mb-1">${t('job_final_amount')}</div>
        <div class="fw-bold" style="font-size:22px;color:#15803D;">₹${total}</div>
      </div>
      <a href="/mechanic/invoice.html?id=${booking.id}" class="btn btn-outline-secondary rounded-pill w-100 mt-3 fw-medium">
        📄 ${t('job_view_invoice')}
      </a>`;
    }

    function renderEstimateItems(items, editable, isAdditional = false) {
      if (!items || items.length === 0) return `<div class="text-muted small text-center py-2">${t('job_no_items')}</div>`;
      return items.map((item, i) => `
      <div class="estimate-item-row">
        <span style="font-size:13px;font-weight:500;">${item.item_name}</span>
        <div class="d-flex align-items-center gap-2">
          <span style="font-size:13px;font-weight:700;">₹${item.price}</span>
          ${editable ? `<button type="button" onclick="removeItem(${i}, ${isAdditional})" class="btn btn-sm text-danger p-0 px-1" style="font-size:16px;line-height:1;">×</button>` : ''}
        </div>
      </div>`).join('');
    }

    function updateEstTotal() {
      const el = document.getElementById('est-total');
      let t = estimateItems.reduce((s, i) => s + (i.price || 0), 0);
      const pcEl = document.getElementById('pickup-charge-input');
      if (pcEl && pcEl.value) t += parseFloat(pcEl.value) || 0;
      if (el) el.textContent = `₹${t}`;
    }

    async function acceptBooking() {
      try {
        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/status`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'accepted' })
        });
        if (!res.ok) throw new Error();
        booking = await res.json();
        renderPage();
      } catch { showToast(t('job_accept_failed'), 'danger'); }
    }

    async function rejectBooking() {
      if (!confirm(t('job_confirm_reject'))) return;
      try {
        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/status`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'rejected' })
        });
        if (!res.ok) throw new Error();
        booking = await res.json();
        renderPage();
      } catch { showToast(t('job_reject_failed'), 'danger'); }
    }

    function addEstItem() {
      const name = document.getElementById('est-item-name').value.trim();
      const price = parseFloat(document.getElementById('est-item-price').value);
      if (!name || isNaN(price) || price <= 0) { showError('est-error', t('job_enter_valid_name_price')); return; }
      estimateItems.push({ item_name: name, price });
      document.getElementById('est-item-name').value = '';
      document.getElementById('est-item-price').value = '';
      document.getElementById('est-items-list').innerHTML = renderEstimateItems(estimateItems, true);
      updateEstTotal();
    }

    function addAddItem() {
      const name = document.getElementById('add-item-name').value.trim();
      const price = parseFloat(document.getElementById('add-item-price').value);
      if (!name || isNaN(price) || price <= 0) { showError('add-error', t('job_enter_valid_name_price')); return; }
      additionalItems.push({ item_name: name, price });
      document.getElementById('add-item-name').value = '';
      document.getElementById('add-item-price').value = '';
      document.getElementById('add-items-list').innerHTML = renderEstimateItems(additionalItems, true, true);
    }

    function removeItem(idx, isAdditional) {
      if (isAdditional) {
        additionalItems.splice(idx, 1);
        document.getElementById('add-items-list').innerHTML = renderEstimateItems(additionalItems, true, true);
      } else {
        estimateItems.splice(idx, 1);
        document.getElementById('est-items-list').innerHTML = renderEstimateItems(estimateItems, true);
        updateEstTotal();
      }
    }

    async function sendEstimate() {
      if (estimateItems.length === 0) { showError('est-error', t('job_add_at_least_one_item')); return; }
      const btn = document.getElementById('send-est-btn');
      btn.disabled = true; btn.textContent = t('job_sending');

      const pickupCharge = booking.requires_pick_and_drop
        ? parseFloat(document.getElementById('pickup-charge-input')?.value || 0)
        : null;
      const hasHidden = document.getElementById('hidden-issues-toggle')?.checked || false;

      try {
        if (booking.status === 'pending') {
          await fetch(`${getApiBase()}/bookings/${bookingId}/status`, {
            method: 'PATCH',
            headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'accepted' })
          });
        }

        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/estimate`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            estimate_details: estimateItems,
            estimate_status: 'pending',
            pickup_charge: pickupCharge,
            has_hidden_issues: hasHidden
          })
        });
        if (!res.ok) throw new Error();

        const otpRes = await fetch(`${getApiBase()}/bookings/${bookingId}/send-estimate-otp`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
        });
        const otpData = await otpRes.json();
        if (!otpRes.ok) throw new Error(otpData.detail || t('job_otp_send_failed'));

        showToast(t('job_otp_resent_toast'), 'success');
        setTimeout(() => location.reload(), 1500);
      } catch(e) { showError('est-error', e.message || t('job_send_estimate_failed')); }
      finally { btn.disabled = false; btn.textContent = t('job_send_estimate_btn'); }
    }

    async function sendAdditionalEstimate() {
      if (additionalItems.length === 0) { showError('add-error', t('job_add_at_least_one_item')); return; }
      const btn = document.getElementById('send-add-btn');
      btn.disabled = true; btn.textContent = t('job_sending');
      const note = document.getElementById('add-note')?.value.trim() || null;

      try {
        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/additional-estimate`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: additionalItems, note })
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        showToast(t('job_additional_estimate_sent_toast'), 'success');
        setTimeout(() => location.reload(), 1500);
      } catch { showError('add-error', t('job_additional_estimate_failed')); }
      finally { btn.disabled = false; btn.textContent = t('job_send_additional_estimate'); }
    }

    // ✅ Resend Estimate OTP
    async function resendEstimateOTP() {
      const btn = document.getElementById('resend-est-btn');
      btn.disabled = true; btn.textContent = t('job_sending');
      try {
        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/send-estimate-otp`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || t('job_generic_failed'));
        showToast(t('job_otp_resent_toast'), 'success');
      } catch(e) {
        showToast(e.message || t('job_resend_failed'), 'danger');
      } finally {
        btn.disabled = false; btn.textContent = `🔄 ${t('job_resend_otp')}`;
      }
    }

    // ✅ Resend Additional OTP
    async function resendAdditionalOTP() {
      const btn = document.getElementById('resend-add-btn');
      btn.disabled = true; btn.textContent = t('job_sending');
      try {
        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/additional-estimate`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: additionalItems, note: null })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || t('job_generic_failed'));
        showToast(t('job_otp_resent_toast'), 'success');
      } catch(e) {
        showToast(e.message || t('job_resend_failed'), 'danger');
      } finally {
        btn.disabled = false; btn.textContent = `🔄 ${t('job_resend_otp')}`;
      }
    }

    function openGarageServices(context = 'estimate') {
      garageServicesContext = context;
      selectedGarageServices.clear();
      const modalTitle = document.querySelector('#garageServicesModal .modal-title');
      if (modalTitle) modalTitle.textContent = context === 'additional' ? t('job_modal_additional_items') : t('job_modal_select_services');
      const container = document.getElementById('garage-services-list');

      if (myGarageServices.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-muted small">${t('job_no_predefined_services')}</div>`;
      } else {
        const grouped = {};
        myGarageServices.forEach(s => {
          if (!s.is_available) return;
          const cat = s.category || 'Other';
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(s);
        });

        let html = '';
        for (const cat in grouped) {
          html += `<div class="fw-bold mt-3 mb-2" style="font-size:13px;color:var(--color-primary);text-transform:uppercase;">${cat}</div>`;
          grouped[cat].forEach(s => {
            html += `
            <div class="form-check d-flex align-items-center mb-2 p-2 rounded-3 border" style="background:#f8f9fa;">
              <input class="form-check-input ms-0 me-2 mt-0" type="checkbox" id="gs-${s.id}" value="${s.id}" onchange="toggleServiceSelection(${s.id}, this.checked)">
              <label class="form-check-label w-100 d-flex justify-content-between align-items-center" for="gs-${s.id}" style="font-size:14px;cursor:pointer;">
                <span>${s.service_name}</span>
                <span class="fw-bold text-dark">${s.price ? `₹${s.price}` : t('job_price_not_set')}</span>
              </label>
            </div>`;
          });
        }
        if (!html) html = `<div class="text-center py-4 text-muted small">${t('job_no_active_services')}</div>`;
        container.innerHTML = html;
      }
      new bootstrap.Modal(document.getElementById('garageServicesModal')).show();
    }

    function toggleServiceSelection(id, isChecked) {
      if (isChecked) selectedGarageServices.add(id);
      else selectedGarageServices.delete(id);
    }

    function confirmGarageServices() {
      if (selectedGarageServices.size > 0) {
        myGarageServices.forEach(s => {
          if (selectedGarageServices.has(s.id)) {
            if (garageServicesContext === 'additional') {
              additionalItems.push({ item_name: s.service_name, price: s.price || 0 });
            } else {
              estimateItems.push({ item_name: s.service_name, price: s.price || 0 });
            }
          }
        });
        if (garageServicesContext === 'additional') {
          const listEl = document.getElementById('add-items-list');
          if (listEl) listEl.innerHTML = renderEstimateItems(additionalItems, true, true);
        } else {
          document.getElementById('est-items-list').innerHTML = renderEstimateItems(estimateItems, true);
          updateEstTotal();
        }
      }
      bootstrap.Modal.getInstance(document.getElementById('garageServicesModal')).hide();
    }

    function openOTP(type) {
      otpAction = type;
      document.getElementById('otp-input').value = '';
      document.getElementById('otp-error').classList.add('d-none');
      if (type === 'estimate') {
        document.getElementById('otp-modal-title').textContent = t('job_verify_estimate_otp');
        document.getElementById('otp-modal-desc').textContent = t('job_otp_desc_estimate');
      } else {
        document.getElementById('otp-modal-title').textContent = t('job_verify_additional_otp');
        document.getElementById('otp-modal-desc').textContent = t('job_otp_desc_additional');
      }
      new bootstrap.Modal(document.getElementById('otpModal')).show();
    }

    async function confirmOTP() {
      const otp = document.getElementById('otp-input').value.trim();
      if (otp.length !== 4) { showOTPError(t('job_otp_enter_4_digit')); return; }
      const btn = document.getElementById('otp-confirm-btn');
      btn.disabled = true; btn.textContent = t('job_verifying');

      const endpoint = otpAction === 'estimate'
        ? `/bookings/${bookingId}/verify-estimate-otp?otp=${otp}`
        : `/bookings/${bookingId}/verify-additional-otp?otp=${otp}`;

      try {
        const res = await fetch(`${getApiBase()}${endpoint}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}` }
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || t('job_otp_invalid'));
        }
        booking = await res.json();
        bootstrap.Modal.getInstance(document.getElementById('otpModal')).hide();
        showToast(`${t('job_otp_verified')} ✓`, 'success');
        setTimeout(() => location.reload(), 1000);
      } catch(e) { showOTPError(e.message || t('job_otp_invalid_retry')); }
      finally { btn.disabled = false; btn.textContent = t('job_confirm'); }
    }

    async function completeJob() {
      const finalAmount = parseFloat(document.getElementById('final-amount-input')?.value || 0);
      const btn = document.getElementById('complete-btn');
      btn.disabled = true; btn.textContent = t('job_completing');

      try {
        const res = await fetch(`${getApiBase()}/bookings/${bookingId}/status`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'completed', garage_note: `Final amount: ₹${finalAmount}`, final_amount: finalAmount })
        });
        if (!res.ok) throw new Error();
        booking = await res.json();
        renderPage();
        showToast(`${t('job_completed_toast')} 🎉`, 'success');
      } catch { showError('complete-error', t('job_complete_failed')); }
      finally { btn.disabled = false; btn.textContent = `${t('job_mark_complete')} ✓`; }
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.remove('d-none'); }
    }
    function showOTPError(msg) {
      const el = document.getElementById('otp-error');
      el.textContent = msg; el.classList.remove('d-none');
    }
    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `alert alert-${type} position-fixed shadow rounded-3`;
      t.style.cssText = 'top:80px;right:20px;z-index:9999;font-size:14px;min-width:220px;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // ── WebRTC — mechanic calls customer using the existing mechanic WebSocket ──
    let _bookingPc = null;
    let _bookingLocalStream = null;
    let _bookingCallTimer = null;
    let _bookingCallSeconds = 0;
    let _bookingCallCustomerId = null;

    function bookingCallWsOpen() {
      return typeof _ws !== 'undefined' && _ws?.readyState === WebSocket.OPEN;
    }

    function showBookingCallOverlay(status = t('job_calling_customer')) {
      let overlay = document.getElementById('booking-call-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'booking-call-overlay';
        overlay.style.cssText = 'display:flex;position:fixed;inset:0;z-index:99999;background:#0a0a0a;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 24px 80px;color:#fff;';
        overlay.innerHTML = `
          <div style="text-align:center;"><div style="color:#22C55E;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;">📞 ${t('job_outgoing_call')}</div>
          <div style="font-size:22px;font-weight:700;">${t('job_customer_label')}</div><div id="booking-call-status" style="color:#9CA3AF;font-size:14px;margin-top:6px;"></div></div>
          <div style="width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;font-size:46px;">👤</div>
          <button onclick="endBookingCall()" style="width:68px;height:68px;border-radius:50%;background:#E53E3E;border:none;color:#fff;font-size:28px;cursor:pointer;">☎</button>`;
        document.body.appendChild(overlay);
      }
      overlay.style.display = 'flex';
      document.getElementById('booking-call-status').textContent = status;
    }

    async function startBookingCall() {
      if (_bookingPc) return;
      const button = document.getElementById('call-customer-btn');
      _bookingCallCustomerId = booking?.customer_id;
      if (!booking?.garage_id || !_bookingCallCustomerId) {
        showToast(t('job_customer_call_unavailable'), 'danger');
        return;
      }
      button.disabled = true;
      button.textContent = t('job_connecting');
      try {
        if (!bookingCallWsOpen()) {
          showToast(t('job_connection_not_ready'), 'warning');
          return;
        }
        _bookingLocalStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        _bookingPc = new RTCPeerConnection({ iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ] });
        _bookingLocalStream.getTracks().forEach(track => _bookingPc.addTrack(track, _bookingLocalStream));
        _bookingPc.ontrack = event => {
          let audio = document.getElementById('booking-call-audio');
          if (!audio) { audio = document.createElement('audio'); audio.id = 'booking-call-audio'; audio.autoplay = true; document.body.appendChild(audio); }
          audio.srcObject = event.streams[0];
        };
        _bookingPc.onicecandidate = event => {
          if (event.candidate && bookingCallWsOpen()) {
            _ws.send(JSON.stringify({ type: 'webrtc_ice', target_customer_id: _bookingCallCustomerId, candidate: event.candidate }));
          }
        };
        _bookingPc.onconnectionstatechange = () => {
          if (['disconnected', 'failed', 'closed'].includes(_bookingPc?.connectionState)) endBookingCall();
        };
        const offer = await _bookingPc.createOffer();
        await _bookingPc.setLocalDescription(offer);
        _ws.send(JSON.stringify({ type: 'webrtc_offer', target_customer_id: _bookingCallCustomerId, offer }));

        const auth = { 'Authorization': `Bearer ${MECHANIC_AUTH.getToken()}`, 'Content-Type': 'application/json' };
        fetch(`${getApiBase()}/sos/${booking.id}/store-offer?type=booking`, { method: 'POST', headers: auth, body: JSON.stringify({ offer }) }).catch(() => {});
        fetch(`${getApiBase()}/sos/${booking.id}/call-request?type=booking`, { method: 'POST', headers: auth }).catch(() => {});
        showBookingCallOverlay(t('job_ringing_customer'));
      } catch (error) {
        endBookingCall();
        showToast(error.message || t('job_call_start_failed'), 'danger');
      } finally {
        button.disabled = false;
        button.textContent = `📞 ${t('job_call_customer')}`;
      }
    }

    window.addEventListener('gnm_webrtc', async event => {
      const data = event.detail;
      if (data.type === 'webrtc_answer' && _bookingPc) {
        await _bookingPc.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('booking-call-status').textContent = t('job_connected');
        _bookingCallSeconds = 0;
        _bookingCallTimer = setInterval(() => {
          _bookingCallSeconds++;
          const m = String(Math.floor(_bookingCallSeconds / 60)).padStart(2, '0');
          const s = String(_bookingCallSeconds % 60).padStart(2, '0');
          const status = document.getElementById('booking-call-status');
          if (status) status.textContent = `${m}:${s}`;
        }, 1000);
      } else if (data.type === 'webrtc_ice' && _bookingPc) {
        try { await _bookingPc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) { }
      } else if (data.type === 'webrtc_end') {
        endBookingCall(false);
      }
    });

    function endBookingCall(notify = true) {
      if (_bookingPc) { _bookingPc.close(); _bookingPc = null; }
      if (_bookingLocalStream) { _bookingLocalStream.getTracks().forEach(track => track.stop()); _bookingLocalStream = null; }
      if (_bookingCallTimer) { clearInterval(_bookingCallTimer); _bookingCallTimer = null; }
      const audio = document.getElementById('booking-call-audio');
      if (audio) audio.remove();
      const overlay = document.getElementById('booking-call-overlay');
      if (overlay) overlay.remove();
      if (notify && bookingCallWsOpen() && _bookingCallCustomerId) {
        _ws.send(JSON.stringify({ type: 'webrtc_end', target_customer_id: _bookingCallCustomerId }));
      }
      _bookingCallCustomerId = null;
    }

    document.addEventListener('DOMContentLoaded', loadJob);

    // Language switch hote hi dynamic content (JS se aaya text) bhi refresh karo
    document.addEventListener('i18n:ready', () => {
      if (booking) renderPage();
    });
  </script>
</body>
</html>
